[build-system]
requires = ["setuptools>=68.0","wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "amni-prism"
version = "0.1.1"
description = "Shared knowledge atlas built on PRISM-TEX (.ptex) nonce-addressed maps with content-hash dedup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name="Amnibro",email="99765883+Amnibro@users.noreply.github.com"}]
keywords = ["ptex","gf17","knowledge-atlas","federated","texture-native","dedup","content-hash","adam","amni"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.21"]
[project.scripts]
prism = "prism.cli:main"
[project.urls]
Homepage = "https://github.com/Amnibro/Amni-Prism"
Source = "https://github.com/Amnibro/Amni-Prism"
Issues = "https://github.com/Amnibro/Amni-Prism/issues"
Changelog = "https://github.com/Amnibro/Amni-Prism/blob/master/CHANGELOG.md"
[tool.setuptools.packages.find]
include = ["prism*"]
exclude = ["tests*","scripts*","staging*"]
