[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
[project]
name = "amni-prism"
version = "0.1.0"
description = "Shared knowledge atlas built on PTEX nonce-addressed textures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
[project.scripts]
prism = "prism.cli:main"
[project.urls]
Homepage = "https://github.com/anmire/Amni-Prism"
[tool.setuptools.packages.find]
include = ["prism*"]
